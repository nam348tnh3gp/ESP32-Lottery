name: Build ESP32 Lottery Miner

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.ino'
      - '**.h'
      - '**.cpp'
      - 'platformio.ini'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Cho phép chạy thủ công

jobs:
  build:
    name: Build for ${{ matrix.env }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32dev
          - esp32-s3-devkitc-1
          - esp32-c3-devkitm-1
          - esp32-c6-devkitc-1
          - esp32-light
          - esp32-4mb
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Install dependencies
        run: |
          pio pkg install --global --platform symlink
          pio lib --global install
      
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      
      - name: Build firmware for ${{ matrix.env }}
        run: |
          pio run -e ${{ matrix.env }}
      
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/*.bin
            .pio/build/${{ matrix.env }}/*.elf
            .pio/build/${{ matrix.env }}/*.map
          retention-days: 30
          compression-level: 9
      
      - name: Upload firmware.bin (renamed)
        uses: actions/upload-artifact@v4
        with:
          name: lottery-miner-${{ matrix.env }}.bin
          path: .pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 30

  build-all:
    name: Build All Environments
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "✅ All builds completed"
          echo "📁 Download artifacts from the summary below"
      
      - name: Create summary
        run: |
          echo "# 🎲 ESP32 Lottery Miner Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| esp32dev | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-s3-devkitc-1 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-c3-devkitm-1 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-c6-devkitc-1 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-light | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-4mb | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download firmware from Artifacts section below**" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-all
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Create release directory
        run: |
          mkdir -p release
          cp artifacts/lottery-miner-*/lottery-miner-*.bin release/ 2>/dev/null || true
          cp artifacts/firmware-*/firmware.bin release/ 2>/dev/null || true
          ls -la release/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.bin
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
