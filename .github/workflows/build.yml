name: Build ESP32/ESP8266 Lottery Miner v1.3

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Upload firmware artifacts?'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: 
          - esp32dev
          - esp32-s3
          - esp32-s2
          - esp32-c3
          - esp32-c6
          - esp32-single
          - esp32-light
          - esp32-4mb
          - esp32-factory-reset
          - esp8266
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio-c6.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pio --version
      
      - name: Prepare source files
        run: |
          mkdir -p src
          cp *.ino src/ 2>/dev/null || true
          cp *.h src/ 2>/dev/null || true
          cp *.c src/ 2>/dev/null || true
          cp *.cpp src/ 2>/dev/null || true
          echo "=== Source files ==="
          ls -la src/
      
      - name: Install PlatformIO platforms (for standard boards)
        run: |
          pio platform install espressif32
          pio platform install espressif8266
      
      - name: Install project dependencies (standard)
        run: pio pkg install
      
      # === CHỈ DÀNH CHO ESP32-C6 ===
      - name: Install dependencies for ESP32-C6
        if: matrix.env == 'esp32-c6'
        run: pio pkg install -c platformio-c6.ini -e esp32-c6
      
      - name: Patch arduinoWebSockets for ESP32-C6
        if: matrix.env == 'esp32-c6'
        run: |
          sed -i 's/randomSeed(READ_PERI_REG(DR_REG_RNG_BASE));/randomSeed(millis());/' .pio/libdeps/esp32-c6/arduinoWebSockets/src/WebSocketsServer.cpp
      # ================================

      - name: Build ${{ matrix.env }}
        id: build
        run: |
          if [ "${{ matrix.env }}" = "esp32-c6" ]; then
            echo "::notice::Building ESP32-C6 with platformio-c6.ini"
            pio run -c platformio-c6.ini -e esp32-c6
          else
            pio run -e ${{ matrix.env }}
          fi
        continue-on-error: ${{ matrix.env == 'esp32-c6' }}
      
      - name: Find firmware binary
        id: find_firmware
        if: steps.build.outcome == 'success'
        run: |
          BUILD_DIR=".pio/build/${{ matrix.env }}"
          echo "Searching in: $BUILD_DIR"
          ls -la "$BUILD_DIR/" || true
          
          if [ -f "$BUILD_DIR/firmware.bin" ]; then
            echo "firmware_path=$BUILD_DIR/firmware.bin" >> $GITHUB_OUTPUT
            echo "Found: firmware.bin"
          else
            echo "⚠️ No firmware.bin found"
            ls -la "$BUILD_DIR/" || true
          fi
      
      - name: Upload firmware artifact
        if: steps.build.outcome == 'success' && steps.find_firmware.outputs.firmware_path != '' && (github.event_name != 'workflow_dispatch' || inputs.upload_artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: lottery-miner-${{ matrix.env }}
          path: ${{ steps.find_firmware.outputs.firmware_path }}
          compression-level: 9
          retention-days: 30
          if-no-files-found: warn
      
      - name: Build summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Chip | Cores | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          case "${{ matrix.env }}" in
            esp32dev)     CHIP="ESP32";        CORES="2 (Auto)" ;;
            esp32-s3)     CHIP="ESP32-S3";     CORES="2 (Auto)" ;;
            esp32-s2)     CHIP="ESP32-S2";     CORES="1 (Auto)" ;;
            esp32-c3)     CHIP="ESP32-C3";     CORES="1 (Auto)" ;;
            esp32-c6)     CHIP="ESP32-C6";     CORES="1 (Auto)" ;;
            esp32-single) CHIP="ESP32";        CORES="1 (Forced)" ;;
            esp32-light)  CHIP="ESP32";        CORES="2 (Lite)" ;;
            esp32-4mb)    CHIP="ESP32";        CORES="2 (4MB)" ;;
            esp32-factory-reset) CHIP="ESP32"; CORES="2 (Reset)" ;;
            esp8266)      CHIP="ESP8266";      CORES="1 (Auto)" ;;
          esac
          
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi
          
          echo "| \`${{ matrix.env }}\` | $CHIP | $CORES | $STATUS |" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/*.log
            .pio/build/${{ matrix.env }}/*.txt
          compression-level: 9
          retention-days: 7
          if-no-files-found: ignore

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
      
      - name: Create Release Archive
        run: |
          cd release
          mkdir -p ESP32-Miner-v1.3
          
          for dir in */; do
            env_name="${dir%/}"
            if [ "$env_name" != "ESP32-Miner-v1.3" ]; then
              mkdir -p "ESP32-Miner-v1.3/$env_name"
              cp "$dir"/* "ESP32-Miner-v1.3/$env_name/" 2>/dev/null || true
            fi
          done
          
          zip -r "ESP32-Miner-v1.3-All-Firmwares.zip" ESP32-Miner-v1.3/
          
          echo "=== Release contents ==="
          ls -la ESP32-Miner-v1.3/
          ls -la *.zip
      
      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-Miner-v1.3-All-Firmwares
          path: release/ESP32-Miner-v1.3-All-Firmwares.zip
          compression-level: 9
          retention-days: 90
          if-no-files-found: warn
