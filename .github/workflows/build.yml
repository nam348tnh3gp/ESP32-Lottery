name: Build ESP32 Lottery Miner

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.env }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32dev
          - esp32-s3-devkitc-1
          - esp32-c3-devkitm-1
          - esp32-light
          - esp32-4mb
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pio --version
      
      - name: Prepare source files
        run: |
          # Tạo thư mục src
          mkdir -p src
          
          # Copy tất cả file .ino vào src/
          echo "Copying .ino files..."
          cp *.ino src/ 2>/dev/null || echo "No .ino files found in root"
          
          # Copy tất cả file .h vào src/
          echo "Copying .h files..."
          cp *.h src/ 2>/dev/null || echo "No .h files found in root"
          
          # Copy tất cả file .cpp vào src/
          echo "Copying .cpp files..."
          cp *.cpp src/ 2>/dev/null || echo "No .cpp files found in root"
          
          # Hiển thị cấu trúc
          echo "=== src directory contents ==="
          ls -la src/
          echo "=============================="
      
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      
      - name: Build firmware
        run: pio run -e ${{ matrix.env }}
      
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: lottery-miner-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/firmware.elf
          compression-level: 9
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload renamed firmware
        uses: actions/upload-artifact@v4
        with:
          name: lottery-miner-${{ matrix.env }}.bin
          path: .pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 30
          if-no-files-found: warn

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - name: Create summary
        run: |
          echo "# 🎲 ESP32 Lottery Miner Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| esp32dev | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-s3-devkitc-1 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-c3-devkitm-1 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-light | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-4mb | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download firmware from Artifacts section below**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 How to flash" >> $GITHUB_STEP_SUMMARY
          echo "```bash" >> $GITHUB_STEP_SUMMARY
          echo "# Download firmware.bin from artifacts" >> $GITHUB_STEP_SUMMARY
          echo "# Then flash using esptool:" >> $GITHUB_STEP_SUMMARY
          echo "esptool.py --chip esp32 --port /dev/ttyUSB0 write_flash 0x10000 firmware.bin" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release
          echo "# ESP32 Lottery Miner v${{ github.ref_name }}" > release/README.md
          echo "" >> release/README.md
          echo "## 📦 Firmware Files" >> release/README.md
          echo "" >> release/README.md
          
          find artifacts -name "*.bin" -exec cp {} release/ \;
          
          cd release
          for f in *.bin; do
            sha256sum "$f" > "$f.sha256"
            echo "- \`$f\`" >> README.md
          done
          cd ..
          
          ls -la release/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
