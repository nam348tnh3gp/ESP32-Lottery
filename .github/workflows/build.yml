name: Build ESP32 Lottery Miner

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.ino'
      - '**.h'
      - '**.cpp'
      - 'platformio.ini'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.env }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32dev
          - esp32-s3-devkitc-1
          - esp32-c3-devkitm-1
          - esp32-c6-devkitc-1
          - esp32-light
          - esp32-4mb
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      
      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Update PlatformIO
        run: |
          pio upgrade
          pio system info
      
      - name: Install library dependencies
        run: |
          pio lib install
          pio lib list
      
      - name: Build firmware for ${{ matrix.env }}
        run: |
          pio run -e ${{ matrix.env }}
      
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/*.bin
            .pio/build/${{ matrix.env }}/*.elf
            .pio/build/${{ matrix.env }}/*.map
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload firmware.bin (renamed)
        uses: actions/upload-artifact@v4
        with:
          name: lottery-miner-${{ matrix.env }}.bin
          path: .pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 30
          if-no-files-found: warn

  build-all:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "✅ Build workflow completed"
      
      - name: Create summary
        run: |
          echo "# 🎲 ESP32 Lottery Miner Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Build completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| esp32dev | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-s3-devkitc-1 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-c3-devkitm-1 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-c6-devkitc-1 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-light | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| esp32-4mb | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download firmware from Artifacts section below**" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-all
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.bin" -exec cp {} release/ \;
          ls -la release/
          
          # Tạo file checksum
          cd release
          for f in *.bin; do
            sha256sum "$f" > "$f.sha256"
          done
          cd ..
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
