; PlatformIO Project Configuration File for ESP32 Lottery Miner
; Based on Bruce Firmware structure

[platformio]
default_envs = esp32dev
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_enter, colorize

build_flags =
	-DMINER_VERSION='"v3.1"'
	-DEEPROMSIZE=128
	-Os
	-Wl,--print-memory-usage
	-Wl,--gc-sections
	-DGIT_COMMIT_HASH='"LotteryMiner"'
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-DCONFIG_ASYNC_TCP_USE_WDT=0
	-DMINING_DUAL_CORE=1
	-DHASH_RATE_UPDATE_MS=5000
	-DWATCHDOG_TIMEOUT=30

lib_deps =
	; WiFi Manager
	tzapu/WiFiManager
	; WebSocket Client
	Links2004/WebSockets
	; JSON Parser - dùng version 6 (ổn định như Bruce)
	bblanchon/ArduinoJson@6.21.3
	; Async Web Server
	ESPAsyncWebServer
	; Async TCP
	AsyncTCP
	; OTA Updates
	ayushsharma82/AsyncElegantOTA
	; Time library
	PaulStoffregen/Time
	; NTP Client
	arduino-libraries/NTPClient

; ==================== ESP32 DevKit V1 ====================
[env:esp32dev]
extends = env
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
build_flags = ${env.build_flags} -DBOARD_ESP32_DEVKIT_V1

; ==================== ESP32 DevKit V1 with PSRAM ====================
[env:esp32dev-psram]
extends = env
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = ${env.build_flags} -DBOARD_ESP32_DEVKIT_V1 -DUSE_PSRAM=1

; ==================== ESP32-WROOM-32 ====================
[env:esp32-wroom-32]
extends = env
board = esp32-wroom-32
board_build.f_cpu = 240000000L
build_flags = ${env.build_flags} -DBOARD_ESP32_WROOM_32

; ==================== ESP32-WROVER ====================
[env:esp32-wrover]
extends = env
board = esp32-wrover-kit
board_build.f_cpu = 240000000L
build_flags = ${env.build_flags} -DBOARD_ESP32_WROVER -DUSE_PSRAM=1

; ==================== ESP32-S3 DevKitC-1 ====================
[env:esp32-s3-devkitc-1]
extends = env
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_flags = ${env.build_flags} -DBOARD_ESP32_S3 -DUSE_PSRAM=1

; ==================== ESP32-C3 (Single Core) ====================
[env:esp32-c3-devkitm-1]
extends = env
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L
build_flags = ${env.build_flags} -DBOARD_ESP32_C3 -DSINGLE_CORE_MODE=1

; ==================== ESP32-C6 ====================
[env:esp32-c6-devkitc-1]
extends = env
board = esp32-c6-devkitc-1
board_build.f_cpu = 160000000L
build_flags = ${env.build_flags} -DBOARD_ESP32_C6 -DSINGLE_CORE_MODE=1

; ==================== LIGHT VERSION (No Web Dashboard) ====================
[env:esp32-light]
extends = env
board = esp32dev
board_build.f_cpu = 240000000L
build_flags =
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-DLITE_VERSION=1
	-DDISABLE_WEB_DASHBOARD=1
	-DHASH_RATE_UPDATE_MS=10000

lib_deps =
	tzapu/WiFiManager
	Links2004/WebSockets
	bblanchon/ArduinoJson@6.21.3
	PaulStoffregen/Time
	arduino-libraries/NTPClient

; ==================== 4MB FLASH VERSION (Minimal) ====================
[env:esp32-4mb]
extends = env
board = esp32dev
board_build.f_cpu = 240000000L
build_flags =
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-DDISABLE_WEB_DASHBOARD=1
	-DDISABLE_OTA=1
	-DHASH_RATE_UPDATE_MS=10000
	-include Arduino.h

lib_ignore =
	ESPAsyncWebServer
	AsyncElegantOTA

lib_deps =
	tzapu/WiFiManager
	Links2004/WebSockets
	bblanchon/ArduinoJson@6.21.3
	PaulStoffregen/Time
	arduino-libraries/NTPClient
	AsyncTCP
