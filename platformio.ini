; PlatformIO Project Configuration File for ESP32 Lottery Miner

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_enter, colorize

build_flags =
	-DMINER_VERSION='"v3.1"'
	-Os
	-Wl,--gc-sections
	-DMINING_DUAL_CORE=1
	-DHASH_RATE_UPDATE_MS=5000
	-DWATCHDOG_TIMEOUT=30

lib_deps =
	WiFiManager
	WebSockets
	ArduinoJson
	ESPAsyncWebServer
	AsyncTCP
	AsyncElegantOTA
	Time
	NTPClient

; ==================== ESP32 DevKit V1 ====================
[env:esp32dev]
extends = env
board_build.f_cpu = 240000000L

; ==================== ESP32-S3 DevKitC-1 ====================
[env:esp32-s3-devkitc-1]
extends = env
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
build_flags = ${env.build_flags} -DUSE_PSRAM=1

; ==================== ESP32-C3 (Single Core) ====================
[env:esp32-c3-devkitm-1]
extends = env
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L
build_flags = ${env.build_flags} -DSINGLE_CORE_MODE=1

; ==================== LIGHT VERSION (No Web Dashboard) ====================
[env:esp32-light]
extends = env
build_flags =
	${env.build_flags}
	-DDISABLE_WEB_DASHBOARD=1
	-DLITE_VERSION=1

lib_deps =
	WiFiManager
	WebSockets
	ArduinoJson
	Time
	NTPClient

; ==================== 4MB FLASH VERSION (Minimal) ====================
[env:esp32-4mb]
extends = env
build_flags =
	${env.build_flags}
	-DDISABLE_WEB_DASHBOARD=1
	-DDISABLE_OTA=1

lib_ignore =
	ESPAsyncWebServer
	AsyncElegantOTA

lib_deps =
	WiFiManager
	WebSockets
	ArduinoJson
	Time
	NTPClient
	AsyncTCP
