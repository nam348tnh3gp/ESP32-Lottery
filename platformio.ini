[platformio]
default_envs = esp32dev
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600

board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

build_flags = 
    -DMINER_VERSION='"v3.2.7-Master"'
    -DEEPROMSIZE=128
    -O3
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DMINING_DUAL_CORE=1
    -DHASH_RATE_UPDATE_MS=5000
    -DWATCHDOG_TIMEOUT=30
    -D_GNU_SOURCE

lib_deps = 
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    me-no-dev/ESPAsyncWebServer
    me-no-dev/AsyncTCP
    paulstoffregen/Time
    arduino-libraries/NTPClient

; ==================== ESP32 Standard ====================
[env:esp32dev]
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = ${env.build_flags} -DBOARD_ESP32_DEVKIT_V1

; ==================== ESP32-WROVER ====================
[env:esp32-wrover]
board = esp32-wrover-kit
board_build.f_cpu = 240000000L
build_flags = ${env.build_flags} -DBOARD_ESP32_WROVER -DBOARD_HAS_PSRAM=1 -mfix-esp32-psram-cache-issue

; ==================== ESP32-S3 ====================
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_flags = 
    ${env.build_flags} 
    -DBOARD_ESP32_S3 
    -DARDUINO_USB_MODE=1 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_PSRAM=1
    -DCORE_DEBUG_LEVEL=0

; ==================== ESP32-C3 ====================
[env:esp32-c3]
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L
build_flags = ${env.build_flags} -DBOARD_ESP32_C3 -DSINGLE_CORE_MODE=1 -DMINING_DUAL_CORE=0

; ==================== ESP32-C6 ====================
[env:esp32-c6]
board = esp32-c6-devkitc-1
board_build.f_cpu = 160000000L
build_flags = ${env.build_flags} -DBOARD_ESP32_C6 -DSINGLE_CORE_MODE=1 -DMINING_DUAL_CORE=0

; ==================== LIGHT VERSION ====================
[env:esp32-light]
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags} 
    -DCORE_DEBUG_LEVEL=0 
    -DLITE_VERSION=1 
    -DDISABLE_WEB_DASHBOARD=1
    -DDISABLE_OTA=1
lib_deps = 
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    paulstoffregen/Time
    arduino-libraries/NTPClient

; ==================== 4MB FLASH VERSION ====================
[env:esp32-4mb]
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags} 
    -DCORE_DEBUG_LEVEL=0 
    -DDISABLE_WEB_DASHBOARD=1
    -DDISABLE_OTA=1
    -DOPTIMIZE_MEMORY=1
lib_deps = 
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    paulstoffregen/Time
    arduino-libraries/NTPClient
    me-no-dev/AsyncTCP

; ==================== MAX PERFORMANCE ====================
[env:esp32-max-perf]
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags} 
    -Ofast
    -flto
    -fno-exceptions
    -fno-rtti
    -DMAX_PERFORMANCE=1
    -DHASH_RATE_UPDATE_MS=1000
build_unflags = -Os

[env:esp32-factory-reset]
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = ${env.build_flags} -DFACTORY_RESET=1
