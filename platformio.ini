[platformio]
default_envs = esp32dev
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache

; ==================== BASE DÙNG CHUNG (không platform, không board) ====================
; Các board sẽ kế thừa từ đây, tránh trùng lặp code
[env:esp32_base]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

; Build flags chung cho mọi dòng ESP32 (trừ ESP8266)
build_flags = 
    -DMINER_VERSION='"v4.0-AutoDetect"'
    -DEEPROMSIZE=128
    -O3
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DHASH_RATE_UPDATE_MS=5000
    -DWATCHDOG_TIMEOUT=30
    -D_GNU_SOURCE

; Lib deps cơ bản – mỗi board có thể ghi đè nếu cần
lib_deps = 
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    me-no-dev/ESPAsyncWebServer
    me-no-dev/AsyncTCP
    paulstoffregen/Time
    arduino-libraries/NTPClient

; ==================== NHÓM ESP32 CHUẨN – DÙNG PLATFORM CHÍNH THỨC ====================
; Đặt version cố định để tránh bị ảnh hưởng bởi core mới
[env:esp32dev]
extends = esp32_base
platform = espressif32@^6.7.0
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${esp32_base.build_flags}
    -DBOARD_ESP32_DEVKIT_V1
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

[env:esp32-s3]
extends = esp32_base
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_flags = 
    ${esp32_base.build_flags}
    -DBOARD_ESP32_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_PSRAM=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

[env:esp32-s2]
extends = esp32_base
platform = espressif32@^6.7.0
board = esp32-s2-saola-1
board_build.f_cpu = 240000000L
build_flags = 
    ${esp32_base.build_flags}
    -DBOARD_ESP32_S2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -D Serial=Serial0
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

[env:esp32-c3]
extends = esp32_base
platform = espressif32@^6.7.0
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L
build_flags = 
    ${esp32_base.build_flags}
    -DBOARD_ESP32_C3
    -DCORE_DEBUG_LEVEL=0
    -D Serial=Serial0
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

; ==================== ESP32-C6 – “HỘP CÁT” RIÊNG BIỆT ====================
; Dùng nền tảng Tasmota, core 3.x, kế thừa nhưng bổ sung lib riêng nếu cần
[env:esp32-c6]
extends = esp32_base
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.04.30/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.f_cpu = 160000000L
build_flags = 
    ${esp32_base.build_flags}
    -DBOARD_ESP32_C6
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1
; Nếu thư viện WebSockets bản cũ gây lỗi, hãy thử nâng lên bản mới hơn bằng cách bỏ dòng chú thích bên dưới:
; lib_deps = 
;     ${esp32_base.lib_deps}
;     links2004/WebSockets@^2.5.0

; ==================== CÁC ENV ĐẶC BIỆT (vẫn dùng platform chính thống) ====================

[env:esp32-single]
extends = esp32_base
platform = espressif32@^6.7.0
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${esp32_base.build_flags}
    -DBOARD_ESP32_DEVKIT_V1
    -DSINGLE_CORE_MODE
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

[env:esp32-light]
extends = esp32_base
platform = espressif32@^6.7.0
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${esp32_base.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DLITE_VERSION=1
    -DDISABLE_WEB_DASHBOARD=1
    -DDISABLE_OTA=1
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1
lib_deps = 
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    paulstoffregen/Time
    arduino-libraries/NTPClient

[env:esp32-4mb]
extends = esp32_base
platform = espressif32@^6.7.0
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${esp32_base.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_WEB_DASHBOARD=1
    -DDISABLE_OTA=1
    -DOPTIMIZE_MEMORY=1
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1
lib_deps = 
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    paulstoffregen/Time
    arduino-libraries/NTPClient
    me-no-dev/AsyncTCP

[env:esp32-factory-reset]
extends = esp32_base
platform = espressif32@^6.7.0
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${esp32_base.build_flags}
    -DFACTORY_RESET=1
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

; ==================== ESP8266 – tách biệt hoàn toàn ====================
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
build_flags = 
    -DMINER_VERSION='"v1.3-AutoDetect"'
    -O3
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DHASH_RATE_UPDATE_MS=5000
    -DWATCHDOG_TIMEOUT=30
    -DDISABLE_WEB_DASHBOARD=1
    -D_GNU_SOURCE
lib_deps = 
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    paulstoffregen/Time
    arduino-libraries/NTPClient
    me-no-dev/ESPAsyncTCP
