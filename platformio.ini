; PlatformIO Project Configuration File for ESP32 Lottery Miner
;
; Based on Bruce Firmware structure - Cleaned for Lottery Miner

[platformio]
default_envs =
	esp32dev
	;esp32-s3-devkitc-1
	;esp32-c3-devkitm-1
	;esp32-c6-devkitc-1

;uncomment to not use global dirs to avoid possible conflicts
;platforms_dir = .pio/platforms
;packages_dir = .pio/packages
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache
boards_dir = boards/_boards_json

extra_configs =
	boards/*.ini
	boards/*/*.ini

[env]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_enter, colorize

build_flags =
	-DMINER_VERSION='"v3.1"'
	-DEEPROMSIZE=128
	-Os
	-Wl,--print-memory-usage
	-Wl,--gc-sections
	-DGIT_COMMIT_HASH='"LotteryMiner"'
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-DCONFIG_ASYNC_TCP_USE_WDT=0
	-DMINING_DUAL_CORE=1
	-DHASH_RATE_UPDATE_MS=5000
	-DWATCHDOG_TIMEOUT=30

lib_deps =
	; WiFi Manager
	https://github.com/tzapu/WiFiManager.git#2.0.16-rc.2
	; WebSocket Client
	https://github.com/Links2004/arduinoWebSockets.git#2.5.2
	; JSON Parser
	https://github.com/bblanchon/ArduinoJson.git#6.21.3
	; Async Web Server
	https://github.com/me-no-dev/ESPAsyncWebServer.git#3.2.3
	; Async TCP
	https://github.com/me-no-dev/AsyncTCP.git#1.1.1
	; OTA Updates
	https://github.com/ayushsharma82/AsyncElegantOTA.git#2.2.8
	; Time library
	https://github.com/PaulStoffregen/Time.git#1.6.1
	; NTP Client
	https://github.com/arduino-libraries/NTPClient.git#3.2.1

; ==================== ESP32 DevKit V1 ====================
[env:esp32dev]
extends = env
board_build.f_cpu = 240000000L

; ==================== ESP32 DevKit V1 with PSRAM ====================
[env:esp32dev-psram]
extends = env
board_build.f_cpu = 240000000L
build_flags = ${env.build_flags} -DUSE_PSRAM=1

; ==================== ESP32-WROOM-32 ====================
[env:esp32-wroom-32]
extends = env
board = esp32-wroom-32
board_build.f_cpu = 240000000L

; ==================== ESP32-WROVER ====================
[env:esp32-wrover]
extends = env
board = esp32-wrover-kit
board_build.f_cpu = 240000000L
build_flags = ${env.build_flags} -DUSE_PSRAM=1

; ==================== ESP32-S3 DevKitC-1 ====================
[env:esp32-s3-devkitc-1]
extends = env
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
build_flags = ${env.build_flags} -DUSE_PSRAM=1

; ==================== ESP32-C3 (Single Core) ====================
[env:esp32-c3-devkitm-1]
extends = env
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L
build_flags = ${env.build_flags} -DSINGLE_CORE_MODE=1

; ==================== ESP32-C6 ====================
[env:esp32-c6-devkitc-1]
extends = env
board = esp32-c6-devkitc-1
board_build.f_cpu = 160000000L
build_flags = ${env.build_flags} -DSINGLE_CORE_MODE=1

; ==================== LIGHT VERSION (No Web Dashboard) ====================
[env:esp32-light]
extends = env
build_flags =
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=0
	-DLITE_VERSION=1
	-DDISABLE_WEB_DASHBOARD=1
	-DHASH_RATE_UPDATE_MS=10000

lib_deps =
	https://github.com/tzapu/WiFiManager.git#2.0.16-rc.2
	https://github.com/Links2004/arduinoWebSockets.git#2.5.2
	https://github.com/bblanchon/ArduinoJson.git#6.21.3
	https://github.com/PaulStoffregen/Time.git#1.6.1
	https://github.com/arduino-libraries/NTPClient.git#3.2.1

; ==================== 4MB FLASH VERSION (Minimal) ====================
[env:esp32-4mb]
extends = env
build_flags =
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=0
	-DDISABLE_WEB_DASHBOARD=1
	-DDISABLE_OTA=1
	-DHASH_RATE_UPDATE_MS=10000

lib_ignore =
	ESPAsyncWebServer
	AsyncElegantOTA

lib_deps =
	https://github.com/tzapu/WiFiManager.git#2.0.16-rc.2
	https://github.com/Links2004/arduinoWebSockets.git#2.5.2
	https://github.com/bblanchon/ArduinoJson.git#6.21.3
	https://github.com/PaulStoffregen/Time.git#1.6.1
	https://github.com/arduino-libraries/NTPClient.git#3.2.1
	https://github.com/me-no-dev/AsyncTCP.git#1.1.1
