[platformio]
default_envs = esp32dev
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600

board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

build_flags = 
    -DMINER_VERSION='"v4.0-AutoDetect"'
    -DEEPROMSIZE=128
    -O3
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DHASH_RATE_UPDATE_MS=5000
    -DWATCHDOG_TIMEOUT=30
    -D_GNU_SOURCE

lib_deps = 
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    me-no-dev/ESPAsyncWebServer
    me-no-dev/AsyncTCP
    paulstoffregen/Time
    arduino-libraries/NTPClient

; ==================== ESP32 Standard (Dual Core - Auto Detect) ====================
[env:esp32dev]
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags} 
    -DBOARD_ESP32_DEVKIT_V1
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

; ==================== ESP32-S3 (Dual Core - Auto Detect) ====================
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_flags = 
    ${env.build_flags} 
    -DBOARD_ESP32_S3 
    -DARDUINO_USB_MODE=1 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_PSRAM=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

; ==================== ESP32-S2 (Single Core - Auto Detect) ====================
[env:esp32-s2]
board = esp32-s2-saola-1
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags} 
    -DBOARD_ESP32_S2 
    -DARDUINO_USB_MODE=1 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -D Serial=Serial0
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

; ==================== ESP32-C3 (Single Core - Auto Detect) ====================
[env:esp32-c3]
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L
build_flags = 
    ${env.build_flags} 
    -DBOARD_ESP32_C3 
    -DCORE_DEBUG_LEVEL=0
    -D Serial=Serial0
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

; ==================== ESP32-C6 (Single Core - Auto Detect) ====================
[env:esp32-c6]
board = esp32-c6-devkitc-1
board_build.f_cpu = 160000000L
build_flags = 
    ${env.build_flags} 
    -DBOARD_ESP32_C6 
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

; ==================== ESP32 Dual Core Force SINGLE MODE (Test/Debug) ====================
[env:esp32-single]
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags} 
    -DBOARD_ESP32_DEVKIT_V1
    -DSINGLE_CORE_MODE
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

; ==================== LIGHT VERSION (No Web Dashboard) ====================
[env:esp32-light]
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags} 
    -DCORE_DEBUG_LEVEL=0 
    -DLITE_VERSION=1 
    -DDISABLE_WEB_DASHBOARD=1
    -DDISABLE_OTA=1
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1
lib_deps = 
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    paulstoffregen/Time
    arduino-libraries/NTPClient

; ==================== 4MB FLASH OPTIMIZED ====================
[env:esp32-4mb]
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags} 
    -DCORE_DEBUG_LEVEL=0 
    -DDISABLE_WEB_DASHBOARD=1
    -DDISABLE_OTA=1
    -DOPTIMIZE_MEMORY=1
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1
lib_deps = 
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    paulstoffregen/Time
    arduino-libraries/NTPClient
    me-no-dev/AsyncTCP

; ==================== FACTORY RESET ====================
[env:esp32-factory-reset]
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags} 
    -DFACTORY_RESET=1
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1

; ==================== ESP8266 (Single Core) ====================
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
build_flags = 
    -DMINER_VERSION='"v1.3-AutoDetect"'
    -O3
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DHASH_RATE_UPDATE_MS=5000
    -DWATCHDOG_TIMEOUT=30
    -DDISABLE_WEB_DASHBOARD=1
    -D_GNU_SOURCE
lib_deps = 
    tzapu/WiFiManager
    links2004/WebSockets
    bblanchon/ArduinoJson
    paulstoffregen/Time
    arduino-libraries/NTPClient
    me-no-dev/ESPAsyncTCP
