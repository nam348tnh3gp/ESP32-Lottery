; PlatformIO Project Configuration File for ESP32 Lottery Miner
;
; Based on Bruce Firmware structure - Cleaned for Lottery Miner

[platformio]
default_envs =
	esp32dev
	;esp32-s3-devkitc-1
	;esp32-c3-devkitm-1
	;esp32-c6-devkitc-1

;uncomment to not use global dirs to avoid possible conflicts
;platforms_dir = .pio/platforms
;packages_dir = .pio/packages
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache
boards_dir = boards/_boards_json

extra_configs =
	boards/*.ini
	boards/*/*.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip ; Arduino 3.3.6
platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20260123-153546.zip

monitor_filters = esp32_exception_decoder, send_on_enter, colorize
framework = arduino
board_build.variants_dir = boards
board_build.filesystem = littlefs
build_src_flags =
	-Wall
	-Wclobbered
	-Wempty-body
	-Wignored-qualifiers
	-Woverloaded-virtual=0
	-Wtype-limits
	-Wno-unused-label
	-Wno-comment
	-Wno-unused-variable
	-Wno-narrowing

build_src_filter =
	+<*>
	-<.git/>
	-<.svn/>

build_flags =
	-DMINER_VERSION='"v3.1"'
	-DEEPROMSIZE=128
	-Os
	-Wl,--print-memory-usage
	-Wl,--gc-sections
	-DGIT_COMMIT_HASH='"LotteryMiner"'
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-DCONFIG_ASYNC_TCP_USE_WDT=0
	-DMINING_DUAL_CORE=1
	-DHASH_RATE_UPDATE_MS=5000
	-DWATCHDOG_TIMEOUT=30

extra_scripts =
	pre:patch.py
	post:build.py

lib_deps =
	; WiFi Manager
	tzapu/WiFiManager@^2.0.16-rc.2
	; WebSocket Client
	markus-sattler/WebSockets@^2.5.2
	; JSON Parser
	bblanchon/ArduinoJson@^7.4.2
	; Async Web Server
	ESP32Async/ESPAsyncWebServer
	; Async TCP
	ESP32Async/AsyncTCP
	; OTA Updates
	ayushsharma82/AsyncElegantOTA@^2.2.9
	; Time library
	paulstoffregen/Time@1.6.1
	; NTP Client
	NTPClient@3.2.1

monitor_speed = 115200

; ==================== ESP32 DevKit V1 ====================
[env:esp32dev]
extends = env
board = esp32dev
board_build.f_cpu = 240000000L

build_flags =
	${env.build_flags}
	-DBOARD_ESP32_DEVKIT_V1

; ==================== ESP32 DevKit V1 with PSRAM ====================
[env:esp32dev-psram]
extends = env
board = esp32dev
board_build.f_cpu = 240000000L

build_flags =
	${env.build_flags}
	-DBOARD_ESP32_DEVKIT_V1
	-DUSE_PSRAM=1

; ==================== ESP32-WROOM-32 ====================
[env:esp32-wroom-32]
extends = env
board = esp32-wroom-32
board_build.f_cpu = 240000000L

build_flags =
	${env.build_flags}
	-DBOARD_ESP32_WROOM_32

; ==================== ESP32-WROVER ====================
[env:esp32-wrover]
extends = env
board = esp32-wrover-kit
board_build.f_cpu = 240000000L

build_flags =
	${env.build_flags}
	-DBOARD_ESP32_WROVER
	-DUSE_PSRAM=1

; ==================== ESP32-S3 DevKitC-1 ====================
[env:esp32-s3-devkitc-1]
extends = env
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L

build_flags =
	${env.build_flags}
	-DBOARD_ESP32_S3
	-DUSE_PSRAM=1

; ==================== ESP32-C3 (Single Core) ====================
[env:esp32-c3-devkitm-1]
extends = env
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L

build_flags =
	${env.build_flags}
	-DBOARD_ESP32_C3
	-DSINGLE_CORE_MODE=1

; ==================== ESP32-C6 ====================
[env:esp32-c6-devkitc-1]
extends = env
board = esp32-c6-devkitc-1
board_build.f_cpu = 160000000L

build_flags =
	${env.build_flags}
	-DBOARD_ESP32_C6
	-DSINGLE_CORE_MODE=1

; ==================== LIGHT VERSION (No Web Dashboard) ====================
[env_light]
extends = env
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-DLITE_VERSION=1
	-DDISABLE_WEB_DASHBOARD=1
	-DHASH_RATE_UPDATE_MS=10000

lib_deps =
	tzapu/WiFiManager@^2.0.16-rc.2
	markus-sattler/WebSockets@^2.5.2
	bblanchon/ArduinoJson@^7.4.2
	paulstoffregen/Time@1.6.1
	NTPClient@3.2.1

; ==================== 4MB FLASH VERSION (Minimal) ====================
[env_4mb]
extends = env
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-DDISABLE_WEB_DASHBOARD=1
	-DDISABLE_OTA=1
	-DHASH_RATE_UPDATE_MS=10000
	-include Arduino.h

lib_ignore =
	ESPAsyncWebServer
	AsyncElegantOTA

lib_deps =
	tzapu/WiFiManager@^2.0.16-rc.2
	markus-sattler/WebSockets@^2.5.2
	bblanchon/ArduinoJson@^7.4.2
	paulstoffregen/Time@1.6.1
	NTPClient@3.2.1
	ESP32Async/AsyncTCP
