[env:esp32-c6]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.04.30/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

build_flags = 
    -DMINER_VERSION='"v4.0-AutoDetect"'
    -DEEPROMSIZE=128
    -O3
    -DBOARD_ESP32_C6
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_MBEDTLS_HARDWARE_SHA=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DHASH_RATE_UPDATE_MS=5000
    -DWATCHDOG_TIMEOUT=30
    -D_GNU_SOURCE

lib_deps = 
    tzapu/WiFiManager
    bblanchon/ArduinoJson
    me-no-dev/ESPAsyncWebServer
    me-no-dev/AsyncTCP
    paulstoffregen/Time
    arduino-libraries/NTPClient
    https://github.com/Links2004/WebSockets/archive/refs/heads/master.zip
